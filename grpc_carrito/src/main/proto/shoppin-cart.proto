syntax = "proto3";

package org.example;

option java_package = "org.example.grpc";
option java_multiple_files = true;

service ShoppingCartService {
  rpc GetCatalog (Empty) returns (CatalogResponse);
  rpc ProcessOrder (OrderRequest) returns (OrderResponse);
}

message Empty {}

message ProductItem {
  string id = 1;
  string name = 2;
  double price = 3;
}

message CatalogResponse {
  repeated ProductItem products = 1;
}

message CartItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double price = 4;
}

message OrderRequest {
  string client_id = 1;
  repeated CartItem items = 2;
}

message OrderResponse {
  bool success = 1;
  string message = 2;
}